# Publishes this repo to GitHub Pages on every push to main.
# The configure-pages step turns Pages on the first time it runs, so no manual setup is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build item preview pages and placeholders
        run: pip install -q pillow && node tools/build.js
      - name: Leave out files the site does not need
        run: rm -rf tools HANDOFF.md README.md images/README.md images/logo-preview.png images/extra-*.jpg .github
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
