<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 164" width="168" height="164" role="img" aria-label="Carly's Handmade logo: a cat peeking over a ball of yarn">
  <defs>
    <clipPath id="ball"><circle cx="84" cy="106" r="50"/></clipPath>
    <radialGradient id="shade" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fcd3df"/>
      <stop offset=".55" stop-color="#f7b1c9"/>
      <stop offset="1" stop-color="#ea93b4"/>
    </radialGradient>
  </defs>

  <!-- tail, behind everything -->
  <path d="M124 128 C 152 124, 160 96, 142 86 C 134 82, 128 90, 134 96" fill="none" stroke="#cdbdee" stroke-width="12" stroke-linecap="round"/>
  <path d="M142 86 C 134 82, 128 90, 134 96" fill="none" stroke="#f7b1c9" stroke-width="12" stroke-linecap="round"/>

  <!-- ears -->
  <path d="M50 30 L52 6 Q53 1 58 4 L76 16 Z" fill="#cdbdee" stroke="#cdbdee" stroke-width="6" stroke-linejoin="round"/>
  <path d="M118 30 L116 6 Q115 1 110 4 L92 16 Z" fill="#cdbdee" stroke="#cdbdee" stroke-width="6" stroke-linejoin="round"/>
  <path d="M56 27 L57 12 L70 20 Z" fill="#f7b1c9"/>
  <path d="M112 27 L111 12 L98 20 Z" fill="#f7b1c9"/>
  <!-- head (its chin hides behind the ball) -->
  <circle cx="84" cy="40" r="32" fill="#dccdf7"/>
  <g fill="none" stroke="#b9a7e6" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M84 10 L84 20"/><path d="M74 12 L76 21"/><path d="M94 12 L92 21"/>
  </g>
  <!-- eyes -->
  <circle cx="71" cy="38" r="5.2" fill="#4a3a55"/>
  <circle cx="97" cy="38" r="5.2" fill="#4a3a55"/>
  <circle cx="72.8" cy="36.2" r="1.8" fill="#fff"/>
  <circle cx="98.8" cy="36.2" r="1.8" fill="#fff"/>
  <!-- nose + mouth -->
  <path d="M84 48 L79.8 43.8 Q84 40.6 88.2 43.8 Z" fill="#e8608a"/>
  <g fill="none" stroke="#4a3a55" stroke-width="2.8" stroke-linecap="round">
    <path d="M84 48 Q80 53 76.5 50"/><path d="M84 48 Q88 53 91.5 50"/>
  </g>
  <!-- whiskers -->
  <g stroke="#4a3a55" stroke-width="2.2" stroke-linecap="round" opacity=".75">
    <path d="M52 42 L64 44"/><path d="M53 51 L64 48"/>
    <path d="M116 42 L104 44"/><path d="M115 51 L104 48"/>
  </g>
  <!-- blush -->
  <circle cx="62" cy="48" r="5" fill="#ff9dbd" opacity=".55"/>
  <circle cx="106" cy="48" r="5" fill="#ff9dbd" opacity=".55"/>

  <!-- ball of yarn -->
  <circle cx="84" cy="106" r="50" fill="url(#shade)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#e8608a" stroke-linecap="round" opacity=".4" transform="rotate(-12 84 106)">
    <path d="M30 96 Q84 70 138 96" stroke-width="5"/>
    <path d="M28 116 Q84 88 140 116" stroke-width="6"/>
    <path d="M34 136 Q84 110 134 136" stroke-width="5"/>
    <path d="M58 62 Q50 110 70 156" stroke-width="5"/>
    <path d="M118 66 Q124 112 104 156" stroke-width="6"/>
  </g>
  <!-- soft shadow under paws -->
  <ellipse cx="64" cy="66" rx="12" ry="5" fill="#ea93b4" opacity=".45"/>
  <ellipse cx="104" cy="66" rx="12" ry="5" fill="#ea93b4" opacity=".45"/>
  <!-- paws -->
  <g fill="#dccdf7">
    <rect x="52" y="54" width="22" height="14" rx="7"/>
    <rect x="94" y="54" width="22" height="14" rx="7"/>
  </g>
  <g stroke="#b9a7e6" stroke-width="2.4" stroke-linecap="round">
    <path d="M59 62 L59 66"/><path d="M63 61 L63 66"/><path d="M67 62 L67 66"/>
    <path d="M101 62 L101 66"/><path d="M105 61 L105 66"/><path d="M109 62 L109 66"/>
  </g>

  <!-- loose strand to a heart -->
  <path d="M38 130 C 18 134, 8 144, 18 154 C 24 160, 34 158, 40 154" fill="none" stroke="#e8608a" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 160 L40.6 152.6 A4.4 4.4 0 0 1 48 147.2 A4.4 4.4 0 0 1 55.4 152.6 Z" fill="#e8608a"/>
</svg>
