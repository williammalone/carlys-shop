<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carly's Handmade Blankets & Art</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: a yarn-stripe band, a big friendly masthead, filter chips, then a grid of
     photo cards with hanging price tags. Palette comes from Carly's pieces: navy and
     mint from the chunky blanket, mustard from the granny squares, plum from the paintings. */
  :root{
    --bg:#f4f2f8; --card:#ffffff; --ink:#1c1b3a; --muted:#5f5d7a; --line:#ddd9e9;
    --navy:#233a7a; --mint:#a9dcc5; --plum:#6b3fa0; --mustard:#e3a81c;
    --accent:var(--mustard); --accent-ink:#1c1b3a; --sold:#c0392b; --tag:#fff7dc;
    --shadow:0 10px 30px rgba(28,27,58,.10);
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#13132a; --card:#1d1d3b; --ink:#f1eefa; --muted:#aaa6c4; --line:#30305a;
      --navy:#8fa6ff; --mint:#7cc9a9; --plum:#b48ae0; --mustard:#f0b429;
      --accent-ink:#13132a; --sold:#ff7b6e; --tag:#2a2a4d; --shadow:0 10px 30px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13132a; --card:#1d1d3b; --ink:#f1eefa; --muted:#aaa6c4; --line:#30305a;
    --navy:#8fa6ff; --mint:#7cc9a9; --plum:#b48ae0; --mustard:#f0b429;
    --accent-ink:#13132a; --sold:#ff7b6e; --tag:#2a2a4d; --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--plum);outline-offset:3px;border-radius:6px}

  .wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* yarn stripe, like the color blocks on the navy blanket */
  .yarn{height:18px;background:
    repeating-linear-gradient(90deg,var(--navy) 0 72px,var(--mint) 72px 120px,var(--plum) 120px 156px,var(--mustard) 156px 216px);
    -webkit-mask:radial-gradient(9px 9px at 9px 9px,#000 98%,transparent) 0 0/18px 18px repeat-x;
            mask:radial-gradient(9px 9px at 9px 9px,#000 98%,transparent) 0 0/18px 18px repeat-x}

  header{padding-block:40px 20px}
  .mast{display:grid;grid-template-columns:1fr auto;gap:24px 40px;align-items:end}
  .eyebrow{font:500 .8rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--plum);margin:0 0 14px}
  h1{font:800 clamp(2.4rem,7vw,4.6rem)/.98 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.03em;margin:0;text-wrap:balance}
  h1 em{font-style:normal;color:var(--plum);display:block}
  .tag{font-size:1.1rem;color:var(--muted);margin:14px 0 0;max-width:46ch;text-wrap:pretty}
  .stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none;font:500 .85rem/1.3 var(--mono);color:var(--muted)}
  .stats b{display:block;font:800 1.7rem/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
  .pickup{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 14px;border-radius:999px;background:var(--mint);color:#13261f;font:600 .9rem/1 var(--body)}
  .pickup svg{width:16px;height:16px}

  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line);padding-block:12px;margin-top:22px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
  .chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:600 .9rem/1 var(--body);cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
  .chip:hover{border-color:var(--plum)}
  .chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
  .chip small{opacity:.7;font-weight:500;margin-left:4px}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--muted);font-size:.9rem}
  .ctrl label{display:flex;align-items:center;gap:6px}
  select{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 .9rem var(--body)}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--plum)}

  main{padding-block:26px 56px}
  .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
  @media (max-width:700px){
    .mast{grid-template-columns:1fr;gap:18px}
    .stats{gap:6px 18px}
    .stats b{font-size:1.4rem}
    .bar .wrap{flex-direction:column;align-items:stretch}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
    .chips::-webkit-scrollbar{display:none}
    .chips::after{content:"";flex:0 0 16px}
    .ctrl{justify-content:space-between}
  }
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
  .card{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}
  @media (hover:hover){.card:hover{transform:translateY(-4px) rotate(-.4deg)}.card:hover .ph img{transform:scale(1.04)}}
  .card.sold .ph img{filter:grayscale(.6) brightness(.9)}
  .ph{aspect-ratio:4/5;background:var(--line);position:relative;overflow:hidden;cursor:zoom-in;border:0;padding:0;display:block;width:100%}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:500 .85rem var(--mono)}
  /* hanging price tag */
  .pt{position:absolute;top:12px;right:12px;transform:rotate(6deg);background:var(--tag);color:var(--ink);padding:9px 12px 9px 20px;font:500 .9rem/1 var(--mono);clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);box-shadow:0 4px 10px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
  .pt::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--card);transform:translateY(-50%);box-shadow:inset 0 0 0 1.5px var(--line)}
  .pt.ask{background:var(--mustard);color:var(--accent-ink)}
  .badge{position:absolute;left:12px;top:12px;background:var(--sold);color:#fff;font:800 .72rem/1 var(--display);letter-spacing:.08em;padding:7px 10px;border-radius:999px;transform:rotate(-4deg)}
  .thumbs{display:flex;gap:6px;padding:10px 12px 0}
  .thumbs button{width:40px;height:40px;padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:var(--line);cursor:pointer;opacity:.7}
  .thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbs button[aria-current="true"]{border-color:var(--plum);opacity:1}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .name{font:800 1.1rem/1.2 var(--display);font-variation-settings:"opsz" 24;margin:0;letter-spacing:-.01em;text-wrap:balance}
  .cond{font:500 .72rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .desc{margin:0;font-size:.92rem;color:var(--muted);text-wrap:pretty}
  .btn{margin-top:auto;display:block;text-align:center;padding:11px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:700 .95rem/1 var(--body);transition:transform .15s,filter .15s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font:500 1rem var(--mono)}
  @media (max-width:560px){.body{padding:10px 11px 12px}.name{font-size:.98rem}.desc{display:none}.pt{font-size:.8rem;padding:7px 10px 7px 17px}.thumbs button{width:32px;height:32px}}

  /* how it works */
  .how{border-top:1px solid var(--line);padding-block:40px 56px}
  .how h2{font:800 1.6rem/1.1 var(--display);margin:0 0 20px;letter-spacing:-.02em}
  .steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;padding:18px 18px 18px 58px;position:relative;background:var(--card);border-radius:16px;min-width:0}
  .steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 .95rem var(--display)}
  :root[data-theme="dark"] .steps li::before{color:#13132a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps li::before{color:#13132a}}
  .steps b{display:block;font:700 1rem/1.3 var(--body);margin-bottom:2px}
  .steps span{color:var(--muted);font-size:.92rem}
  .contactline{margin-top:18px;color:var(--muted);font-size:.92rem}
  .contactline code{font:500 .95rem var(--mono);color:var(--ink);user-select:all}
  footer{padding-block:0 48px;color:var(--muted);font:500 .8rem/1.5 var(--mono)}

  /* lightbox */
  dialog.lb{border:0;padding:0;background:transparent;max-width:min(96vw,1100px);max-height:96vh;width:auto}
  dialog.lb::backdrop{background:rgba(10,10,30,.86);backdrop-filter:blur(6px)}
  .lbin{position:relative;display:grid;gap:10px;justify-items:center}
  .lbin img{max-width:min(96vw,1100px);max-height:82vh;width:auto;height:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
  .lbcap{color:#fff;font:600 .95rem var(--body);text-align:center;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
  .lbcap small{font:500 .78rem var(--mono);opacity:.75}
  .lbx,.lbp,.lbn{position:fixed;background:rgba(255,255,255,.14);color:#fff;border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:22px;line-height:1}
  .lbx{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
  .lbp{left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
  .lbn{right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
  .lbx:hover,.lbp:hover,.lbn:hover{background:rgba(255,255,255,.28)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="yarn" aria-hidden="true"></div>
<header class="wrap">
  <div class="mast">
    <div>
      <p class="eyebrow" id="eyebrow">Handmade · one of each</p>
      <h1 id="title">For Sale</h1>
      <p class="tag" id="tagline"></p>
      <div id="pickup"></div>
    </div>
    <ul class="stats" id="stats"></ul>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div class="ctrl">
      <label>Sort
        <select id="sort">
          <option value="default">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name</option>
        </select>
      </label>
      <label><input type="checkbox" id="hideSold" checked> Hide sold</label>
    </div>
  </div>
</div>

<main class="wrap"><div class="grid" id="grid"></div></main>

<section class="how wrap" id="how">
  <h2>How buying works</h2>
  <ol class="steps">
    <li><b>Tap "I'm interested"</b><span>It opens a text or email with the item's name filled in. Say hi.</span></li>
    <li><b>We'll confirm it's yours</b><span>Everything is one of a kind and first come, first served.</span></li>
    <li><b>Pick up and pay</b><span id="paytext">Cash or Venmo at pickup.</span></li>
  </ol>
  <p class="contactline" id="contactline"></p>
</section>
<footer class="wrap" id="footer"></footer>

<dialog class="lb" id="lb" aria-label="Photo">
  <div class="lbin">
    <img id="lbimg" alt="">
    <div class="lbcap"><span id="lbname"></span><small id="lbcount"></small></div>
  </div>
  <button class="lbx" id="lbx" aria-label="Close">×</button>
  <button class="lbp" id="lbp" aria-label="Previous photo">‹</button>
  <button class="lbn" id="lbn" aria-label="Next photo">›</button>
</dialog>

<script src="products.js"></script>
<script>
(function(){
  var S = window.SHOP || {items:[]};
  var items = (S.items || []).map(function(it,i){ it._i=i; it._pics = (it.images && it.images.length) ? it.images.slice() : (it.image ? [it.image] : []); return it; });
  var fmt = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
  var c = S.contact || {};
  var $ = function(id){ return document.getElementById(id); };

  // masthead
  document.title = S.title || "For Sale";
  var t = S.title || "For Sale", m = t.match(/^(.*?)(\s+(?:Blankets|Art|Knits|Crochet|Paintings|Shop|Sale)\b.*)$/i);
  $("title").innerHTML = m ? esc(m[1]) + "<em>" + esc(m[2].trim()) + "</em>" : esc(t);
  $("tagline").textContent = S.tagline || "";
  if (S.eyebrow) $("eyebrow").textContent = S.eyebrow;
  if (c.location) $("pickup").innerHTML = '<span class="pickup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>Local pickup in ' + esc(c.location) + '</span>';

  var cats = [];
  items.forEach(function(it){ var k = it.category || "Other"; if (cats.indexOf(k) < 0) cats.push(k); });
  var avail = items.filter(function(it){ return !it.sold; });
  var statHtml = '<li><b>' + avail.length + '</b>pieces available</li>';
  cats.slice(0,3).forEach(function(k){ var n = avail.filter(function(it){ return (it.category||"Other")===k; }).length; if (n) statHtml += '<li><b>' + n + '</b>' + esc(k.toLowerCase()) + '</li>'; });
  $("stats").innerHTML = statHtml;

  // chips
  var cat = "All";
  function chips(){
    var h = '<button class="chip" aria-pressed="' + (cat==="All") + '" data-cat="All">All<small>' + items.filter(function(it){return !($("hideSold").checked && it.sold);}).length + '</small></button>';
    cats.forEach(function(k){
      var n = items.filter(function(it){ return (it.category||"Other")===k && !($("hideSold").checked && it.sold); }).length;
      h += '<button class="chip" aria-pressed="' + (cat===k) + '" data-cat="' + esc(k) + '">' + esc(k) + '<small>' + n + '</small></button>';
    });
    $("chips").innerHTML = h;
  }
  $("chips").addEventListener("click", function(e){ var b = e.target.closest(".chip"); if(!b) return; cat = b.getAttribute("data-cat"); chips(); render(); });

  function contactHref(item){
    var msg = "Hi! Is the \"" + item.name + "\" still available?";
    if (c.sms) return "sms:" + c.sms + "?&body=" + encodeURIComponent(msg);
    if (c.email) return "mailto:" + c.email + "?subject=" + encodeURIComponent("Interested: " + item.name) + "&body=" + encodeURIComponent(msg);
    return "";
  }
  function priceText(p){ return p==null ? "Ask" : (p===0 ? "Free" : fmt.format(p)); }
  function pv(it){ return it.price==null ? Infinity : it.price; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }

  function render(){
    var sort = $("sort").value, hideSold = $("hideSold").checked;
    var list = items.slice();
    if (hideSold) list = list.filter(function(it){ return !it.sold; });
    if (cat !== "All") list = list.filter(function(it){ return (it.category||"Other")===cat; });
    if (sort==="price-asc") list.sort(function(a,b){ return pv(a)-pv(b); });
    else if (sort==="price-desc") list.sort(function(a,b){ var x=pv(a),y=pv(b); if(x===Infinity&&y===Infinity)return 0; if(x===Infinity)return 1; if(y===Infinity)return -1; return y-x; });
    else if (sort==="name") list.sort(function(a,b){ return a.name.localeCompare(b.name); });
    else list.sort(function(a,b){ return a._i-b._i; });

    var grid = $("grid"); grid.innerHTML = "";
    if (!list.length){ grid.innerHTML = '<p class="empty">Nothing here right now.</p>'; return; }
    list.forEach(function(it){
      var card = document.createElement("article");
      card.className = "card" + (it.sold ? " sold" : "");
      var ph = document.createElement("button"); ph.className="ph"; ph.type="button"; ph.setAttribute("aria-label","View photos of " + it.name);
      var im = null, shown = 0;
      if (it._pics.length){ im = document.createElement("img"); im.src = it._pics[0]; im.alt = it.name; im.loading = "lazy"; ph.appendChild(im); ph.addEventListener("click", function(){ openLb(it, shown); }); }
      else { ph.innerHTML = '<span class="noimg">Photo coming</span>'; ph.disabled = true; }
      var pt = document.createElement("span"); pt.className = "pt" + (it.price==null ? " ask" : ""); pt.textContent = priceText(it.price); ph.appendChild(pt);
      if (it.sold){ var b = document.createElement("span"); b.className="badge"; b.textContent="SOLD"; ph.appendChild(b); }
      card.appendChild(ph);

      if (it._pics.length > 1){
        var strip = document.createElement("div"); strip.className="thumbs";
        it._pics.forEach(function(src,k){
          var tb = document.createElement("button"); tb.type="button"; tb.setAttribute("aria-label","Photo " + (k+1)); if(k===0) tb.setAttribute("aria-current","true");
          var ti = document.createElement("img"); ti.src=src; ti.alt=""; ti.loading="lazy"; tb.appendChild(ti);
          tb.addEventListener("click", function(){ im.src = src; shown = k; Array.prototype.forEach.call(strip.children,function(x){ x.removeAttribute("aria-current"); }); tb.setAttribute("aria-current","true"); });
          strip.appendChild(tb);
        });
        card.appendChild(strip);
      }

      var body = document.createElement("div"); body.className="body";
      var name = document.createElement("h2"); name.className="name"; name.textContent = it.name; body.appendChild(name);
      if (it.condition){ var cd = document.createElement("div"); cd.className="cond"; cd.textContent = it.condition; body.appendChild(cd); }
      if (it.description){ var d = document.createElement("p"); d.className="desc"; d.textContent = it.description; body.appendChild(d); }
      var a = document.createElement("a"); a.className="btn";
      var href = contactHref(it);
      if (it.sold){ a.textContent="Sold"; a.setAttribute("aria-disabled","true"); }
      else if (href){ a.href=href; a.textContent="I'm interested"; }
      else { a.textContent="Contact info coming soon"; a.setAttribute("aria-disabled","true"); }
      body.appendChild(a);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  // lightbox
  var lb = $("lb"), cur = null, idx = 0;
  function openLb(it, i){ cur = it; idx = i >= 0 ? i : 0; showLb(); if (typeof lb.showModal === "function") lb.showModal(); }
  function showLb(){ $("lbimg").src = cur._pics[idx]; $("lbimg").alt = cur.name; $("lbname").textContent = cur.name + " · " + priceText(cur.price); $("lbcount").textContent = cur._pics.length > 1 ? (idx+1) + " / " + cur._pics.length : ""; $("lbp").hidden = $("lbn").hidden = cur._pics.length < 2; }
  function step(n){ if(!cur) return; idx = (idx + n + cur._pics.length) % cur._pics.length; showLb(); }
  $("lbp").addEventListener("click", function(){ step(-1); });
  $("lbn").addEventListener("click", function(){ step(1); });
  $("lbx").addEventListener("click", function(){ lb.close(); });
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.close(); });
  document.addEventListener("keydown", function(e){ if(!lb.open) return; if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); });

  // footer + contact line
  var cl = [];
  if (c.sms) cl.push('Text <code>' + esc(c.sms) + '</code>');
  if (c.email) cl.push('email <code>' + esc(c.email) + '</code>');
  $("contactline").innerHTML = cl.length ? "Prefer to reach out directly? " + cl.join(" or ") + "." : "Contact details are being added. Check back soon.";
  if (S.payment) $("paytext").textContent = S.payment;
  $("footer").textContent = (S.footer || "Everything here is handmade by Carly") + (c.location ? " in " + c.location : "") + ".";

  $("sort").addEventListener("change", render);
  $("hideSold").addEventListener("change", function(){ chips(); render(); });
  chips(); render();
